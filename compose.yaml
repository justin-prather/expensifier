services:
  expensifier:
    image: ghcr.io/justin-prather/expensifier:latest
    container_name: expensifier
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      APP_DATA_ROOT: /data
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      TAGGUN_API_KEY: ${TAGGUN_API_KEY:-}
      CLASSIFICATION_API_KEY: ${CLASSIFICATION_API_KEY:-}
      CLASSIFICATION_ENDPOINT: ${CLASSIFICATION_ENDPOINT:-https://opencode.ai/zen/v1/chat/completions}
      CLASSIFICATION_MODEL: ${CLASSIFICATION_MODEL:-deepseek-v4-flash}
      CLASSIFICATION_TIMEOUT_MILLISECONDS: ${CLASSIFICATION_TIMEOUT_MILLISECONDS:-20000}
      CLASSIFICATION_MAX_RESPONSE_BYTES: ${CLASSIFICATION_MAX_RESPONSE_BYTES:-1000000}
    volumes:
      - ${DOCKER_DATA_ROOT:-./data}:/data
      - expensifier_app_data:/data/app

volumes:
  expensifier_app_data:
