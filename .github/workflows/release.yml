name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.changesets.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Select Changesets mode
        id: changesets
        uses: changesets/action/select-mode@fdf536a68c4154480c89b42547f8102cf0d8bc47 # v2.1.1

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update version pull request
        uses: changesets/action/version@fdf536a68c4154480c89b42547f8102cf0d8bc47 # v2.1.1
        with:
          script: bun run version-packages
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

  publish-release:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.package.outputs.version }}
      major: ${{ steps.package.outputs.major }}
      major_minor: ${{ steps.package.outputs.major_minor }}
      stable: ${{ steps.package.outputs.stable }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release
        run: |
          bun run check
          bun run lint
          bun run test

      - name: Build release container
        run: docker build --tag expensifier:release-candidate .

      - name: Tag release and create GitHub release
        id: publish
        uses: changesets/action/publish@fdf536a68c4154480c89b42547f8102cf0d8bc47 # v2.1.1
        with:
          script: bun run release
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}
          create-github-releases: true
          push-git-tags: true

      - name: Read released package version
        if: steps.publish.outputs.published == 'true'
        id: package
        shell: bash
        run: |
          version=$(bun -p "require('./package.json').version")
          major=${version%%.*}
          major_minor=${version%.*}
          if [[ "$version" == *-* ]]; then
            stable=false
          else
            stable=true
          fi
          {
            echo "version=$version"
            echo "major=$major"
            echo "major_minor=$major_minor"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"

  publish-container:
    if: needs.publish-release.outputs.published == 'true'
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.publish-release.outputs.version }}
            type=sha
            type=raw,value=${{ needs.publish-release.outputs.major_minor }},enable=${{ needs.publish-release.outputs.stable == 'true' }}
            type=raw,value=${{ needs.publish-release.outputs.major }},enable=${{ needs.publish-release.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.publish-release.outputs.stable == 'true' }}

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
